name: Verificación Sprint 2
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sprint2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --simulator --debug
      - name: Consulta pública en simulador iOS
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/public_smoke_test.dart -d "$DEVICE_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: evidencia-ios-sprint2
          path: |
            docs/capturas_sprint2/
            build/ios/iphonesimulator/Runner.app/

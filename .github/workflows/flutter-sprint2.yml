name: Verificación Sprint 2
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'test_driver/**'
      - 'ios/**'
      - 'android/**'
      - 'supabase/**'
      - 'pubspec.*'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sprint2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Iniciar simulador durante las comprobaciones
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "FILACERO_IOS_DEVICE=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --simulator --debug
      - name: Recorridos de consulta, acceso y gestión en iOS
        shell: bash
        timeout-minutes: 25
        env:
          FILACERO_CAPTURE_DIR: docs/capturas_ios
          TEST_ADMIN_EMAIL: ${{ secrets.FILACERO_TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.FILACERO_TEST_ADMIN_PASSWORD }}
          TEST_MANAGER_EMAIL: ${{ secrets.FILACERO_TEST_MANAGER_EMAIL }}
          TEST_MANAGER_PASSWORD: ${{ secrets.FILACERO_TEST_MANAGER_PASSWORD }}
          TEST_DRIVER_EMAIL: ${{ secrets.FILACERO_TEST_DRIVER_EMAIL }}
          TEST_DRIVER_PASSWORD: ${{ secrets.FILACERO_TEST_DRIVER_PASSWORD }}
          TEST_UNASSIGNED_EMAIL: ${{ secrets.FILACERO_TEST_UNASSIGNED_EMAIL }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          capture=(Path.cwd()/os.environ['FILACERO_CAPTURE_DIR']).resolve()
          assert capture.is_relative_to((Path.cwd()/'docs').resolve())
          capture.mkdir(parents=True,exist_ok=True)
          for image in capture.glob('*.png'):
              image.unlink()
          names=['TEST_ADMIN_EMAIL','TEST_ADMIN_PASSWORD','TEST_MANAGER_EMAIL','TEST_MANAGER_PASSWORD','TEST_DRIVER_EMAIL','TEST_DRIVER_PASSWORD','TEST_UNASSIGNED_EMAIL']
          values={name:os.environ[name] for name in names}
          assert all(values.values()), 'Faltan accesos de evaluación en Secrets.'
          with open(os.path.join(os.environ['RUNNER_TEMP'],'test-defines.json'),'w') as f:
              json.dump(values,f)
          PY
          DEVICE_ID="$FILACERO_IOS_DEVICE"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/sprint2_flow_test.dart -d "$DEVICE_ID" --dart-define-from-file="$RUNNER_TEMP/test-defines.json"
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/direct_staff_flow_test.dart -d "$DEVICE_ID" --dart-define-from-file="$RUNNER_TEMP/test-defines.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: evidencia-ios-sprint2
          path: docs/capturas_ios/
